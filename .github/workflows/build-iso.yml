name: Сборка установочного ISO Nexora OS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-iso.yml'
      - 'build/**'
      - 'tests/boot-live.py'
concurrency:
  group: nexora-linux-iso-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Проверка скрипта
        run: |
          bash -n build/build-iso.sh
          python3 tests/check-components.py
      - name: Сборка Live ISO Debian 13
        run: |
          docker run --rm --privileged -e GITHUB_WORKSPACE=/source -v "$PWD:/source" -w /source debian:trixie bash -euc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools isolinux syslinux-common grub-efi-amd64-bin grub-pc-bin mtools ca-certificates
            WORK_DIR=/tmp/nexora-build bash build/build-iso.sh
          '
      - name: Проверка ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools qemu-system-x86 python3-pil
          test -s dist/Nexora_OS_Installer_amd64.iso
          (cd dist && sha256sum -c SHA256SUMS.txt)
          xorriso -indev dist/Nexora_OS_Installer_amd64.iso -ls /live/ | tee /tmp/nexora-live-files.txt
          grep -F filesystem.squashfs /tmp/nexora-live-files.txt
          mkdir -p /tmp/nexora-image
          xorriso -osirrox on -indev dist/Nexora_OS_Installer_amd64.iso -extract /live/filesystem.squashfs /tmp/nexora-image/filesystem.squashfs
          unsquashfs -ll /tmp/nexora-image/filesystem.squashfs | grep -F /usr/local/bin/nexora-center
          unsquashfs -ll /tmp/nexora-image/filesystem.squashfs | grep -F /usr/local/sbin/nexora-update
          unsquashfs -ll /tmp/nexora-image/filesystem.squashfs | grep -F /usr/bin/calamares
          unsquashfs -ll /tmp/nexora-image/filesystem.squashfs | grep -F /usr/bin/firefox-esr
      # Preserve the completed image even when the separate boot smoke-test fails.
      - name: Опубликовать собранный ISO и SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-OS-Installer-ISO
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Проверка фактической загрузки Live ISO в QEMU
        run: python3 tests/boot-live.py dist/Nexora_OS_Installer_amd64.iso
      - name: Опубликовать диагностику загрузки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-QEMU-Boot-Diagnostics
          path: artifacts/live-boot/*
          if-no-files-found: warn
          retention-days: 14
